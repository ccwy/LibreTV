name: docker-publish

# 推送版本 tag（如 v2.0.1）时自动构建并导出镜像为本地可下载的 tar 文件；
# 也可在 Actions 页面手动触发。
# 构建产物为每架构一个 docker tar 包（libretv-amd64.tar / libretv-arm64.tar），
# 在 Actions 运行页面的 Artifacts 区域下载后可用 `docker load -i xxx.tar`
# 导入本地使用。不发布到任何 registry（GHCR / Docker Hub 均不推送）。
#
# 多架构构建拆分：amd64 与 arm64 各自跑在原生 runner 上（GitHub 公开仓库
# 免费提供 ubuntu-24.04-arm），各自导出单架构 docker tar 包。QEMU 跨架构
# 模拟 npm ci / next build 极慢且不稳（Illegal instruction 崩溃），不再使用。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 先跑类型检查与单测，避免把坏版本打成镜像
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # tag 触发时强制 tag 和 package.json 版本一致，避免镜像标签与 /api/status 返回值不一致
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} 与 package.json 版本 ${pkg} 不一致。请改用 npm version ${tag} 更新版本后再推 tag。"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: 计算架构短名与 tar 文件名
        id: names
        run: |
          arch="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          echo "arch=${arch}" >> "$GITHUB_OUTPUT"
          echo "tar=libretv-${arch}.tar" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # 单架构导出为本地 docker tar 包（type=docker），无需登录任何 registry
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: libretv:${{ steps.names.outputs.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ steps.names.outputs.tar }}

      - name: 上传 tar 包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.tar }}
          path: ${{ steps.names.outputs.tar }}
          if-no-files-found: error